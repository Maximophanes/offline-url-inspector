name: Verify and explicitly deploy URL Inspector

# No automatic push deployment. Future dispatch requires an exact reviewed
# commit on main, an accepted source digest and explicit authorization.
on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Exact reviewed 40-character main commit
        required: true
        type: string
      source_inputs_sha256:
        description: Accepted source-input digest from the final build manifest
        required: true
        type: string
      authorize_deployment:
        description: Production deployment explicitly authorized
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && inputs.authorize_deployment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bind dispatch to the checked-out immutable commit
        env:
          EXPECTED_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install isolated checksum-pinned official Deno 2.9.7
        run: |
          mkdir "$RUNNER_TEMP/deno-runtime"
          curl --fail --location --max-time 120 --proto '=https' --tlsv1.2 https://github.com/denoland/deno/releases/download/v2.9.7/deno-x86_64-unknown-linux-gnu.zip -o "$RUNNER_TEMP/deno-runtime/deno.zip"
          echo 'c6527f24f4b16031d3ae4fa9f658d5f11534c8d84ce7dc8502420280919c3490  '"$RUNNER_TEMP/deno-runtime/deno.zip" | sha256sum --check --strict
          unzip -j "$RUNNER_TEMP/deno-runtime/deno.zip" deno -d "$RUNNER_TEMP/deno-runtime"
          chmod 700 "$RUNNER_TEMP/deno-runtime/deno"
          echo "$RUNNER_TEMP/deno-runtime" >> "$GITHUB_PATH"
      - name: Cache only locked development dependencies
        run: deno cache --frozen --lock=deno.lock tests/final-copy-results.mjs
      - name: Build the final release and verify prerequisites
        env:
          EXPECTED_SOURCE: ${{ inputs.source_inputs_sha256 }}
        run: |
          python3 -B tools/build.py --final-release --output-root "$RUNNER_TEMP/final"
          python3 -B tools/verify_release.py --release-root "$RUNNER_TEMP/final"
          python3 -B tools/release_gate.py --release-root "$RUNNER_TEMP/final" --deno "$(command -v deno)" --report "$RUNNER_TEMP/release-gate.json"
          python3 -c 'import json,os; m=json.load(open(os.environ["RUNNER_TEMP"]+"/final/build-manifest.json")); assert m["releaseVersion"]=="3.3.0" and m["buildKind"]=="final" and m["releaseCandidate"] is False and m["publicationAuthorized"] is False, "Incorrect final build identity"; assert m["sourceIdentity"]["inputsSHA256"]==os.environ["EXPECTED_SOURCE"], "Unreviewed source inputs"'
      - name: Check current packaging and deployment safeguards
        run: python3 -B tests/current-release.py --release-root "$RUNNER_TEMP/final" --report "$RUNNER_TEMP/release-checks.json"
      - name: Preserve final identity and verification receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-final-${{ github.sha }}
          path: |
            ${{ runner.temp }}/final/build-manifest.json
            ${{ runner.temp }}/final/SHA256SUMS
            ${{ runner.temp }}/release-gate.json
            ${{ runner.temp }}/release-checks.json
          if-no-files-found: error
      - name: Upload only the newly verified hosted edition
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/final/site
          include-hidden-files: true
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Reject a run superseded while awaiting approval
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Deploy this run's verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
